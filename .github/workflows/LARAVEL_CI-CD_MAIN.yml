name: LARAVEL_CI/CD_MAIN

on:
  push:
    branches: [ "main" ]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: '8.2'
        extensions: mbstring, pdo_sqlite, pdo_mysql, gd
        coverage: none

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install dependencies (dev, untuk test)
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate key
      run: php artisan key:generate

    - name: Directory permissions
      run: chmod -R 775 storage bootstrap/cache

    - name: Execute tests (Unit & Feature)
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: ":memory:"
      run: php artisan test

    # ---- Build artefak produksi (tanpa dev dependencies) ----
    - name: Install production dependencies
      run: |
        rm -rf vendor bootstrap/cache/*.php
        composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --no-dev --optimize-autoloader

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ftp.devtribe.my.id
        username: sko@sko.devtribe.my.id
        password: ${{ secrets.ftp_password }}
        port: 21
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          .env
          .env.*
          tests/**
          storage/**
          bootstrap/cache/*.php
          public/dist/img/products/**
          phpunit.xml
          zquery/**
